# No game data in CI: clang-format checks changed C++ files; host-side tests run on Linux and Windows.
# A separate Linux job runs the tests with AddressSanitizer. Local game checks use tools/test_all.sh.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # The repository's one clang-format version (docs/CONVENTIONS.md, tools/git-hooks/pre-commit).
      - run: pip install clang-format==23.1.3
      - name: clang-format on changed files
        run: |
          base=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          files=$(git diff --name-only --diff-filter=d "$base" -- '*.cpp' '*.h' '*.hpp' | grep -vE '^(thirdparty|private|ArkeyanRecompLib|lib)/' || true)
          [ -z "$files" ] || clang-format --dry-run --Werror --style=file $files

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      # clang, as the Linux kit (zig) and the sanitizers job: GCC cannot compile XenonUtils (xbox.h).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang libusb-1.0-0-dev zlib1g-dev libvulkan-dev libx11-dev
          echo "TOOLCHAIN=-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
      # The kit's toolchain, not MSVC, so CI builds what players get: llvm-mingw of tools/build_windows.sh (kit.txt).
      - name: llvm-mingw
        if: runner.os == 'Windows'
        run: |
          v=20260922
          curl -sSfLO "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip"
          echo "e3ad77d117a4bea19a7a3b333341824d79a5a371004a10e25b8504e7b3047666  llvm-mingw-$v-ucrt-x86_64.zip" | sha256sum -c
          7z x -y -o"$RUNNER_TEMP" "llvm-mingw-$v-ucrt-x86_64.zip" > /dev/null
          root=$(cygpath -m "$RUNNER_TEMP")/llvm-mingw-$v-ucrt-x86_64
          echo "TOOLCHAIN=-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-w64-mingw32-clang.cmake -DLLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          command -v ninja || pip install ninja
      - name: Configure (tests only, no game)
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSKY_WERROR=ON -DSKY_TESTS_ONLY=ON ${TOOLCHAIN:-}
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libusb-1.0-0-dev zlib1g-dev libvulkan-dev libx11-dev
      - run: >
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang -DSKY_SANITIZE=address -DSKY_TESTS_ONLY=ON
      - run: cmake --build build-asan --parallel
      - run: ctest --test-dir build-asan --output-on-failure
