# No game data in CI: clang-format and clang-tidy (.clang-tidy, bug finders) check changed C++ files; host-side tests
# run on Linux and Windows.
# A separate Linux job runs the tests with AddressSanitizer. Local game checks use tools/test_all.sh.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also runs clang-tidy on every file of the compile database, not only the changed ones

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # The repository's one clang-format version (docs/CONVENTIONS.md, tools/git-hooks/pre-commit).
      - run: pip install clang-format==23.1.3
      - name: clang-format on changed files
        run: |
          base=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          files=$(git diff --name-only --diff-filter=d "$base" -- '*.cpp' '*.h' '*.hpp' | grep -vE '^(thirdparty|private|ArkeyanRecompLib|lib)/' || true)
          [ -z "$files" ] || clang-format --dry-run --Werror --style=file $files

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy libusb-1.0-0-dev zlib1g-dev libvulkan-dev libx11-dev
      - name: Configure (tests only, compile database)
        run: cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSKY_TESTS_ONLY=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build (generated headers)
        run: cmake --build build-tidy --parallel
      # Changed files block a pull request. Started by hand, every file is checked and the findings are listed by check
      # without failing: the older code still has findings (2026-11-12: getenv in host/env.h, optional access in
      # host/portal_slots.h), paid down file by file.
      - name: clang-tidy on changed files (every file, as a report, when started by hand)
        run: |
          base=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          python3 - "$base" "${{ github.event_name }}" <<'PY'
          import json, os, subprocess, sys
          base, event = sys.argv[1], sys.argv[2]
          db = {os.path.relpath(e["file"], os.getcwd()) for e in json.load(open("build-tidy/compile_commands.json"))}
          ours = {f for f in db if f.endswith(".cpp") and not f.startswith(("thirdparty/", "private/", "ArkeyanRecompLib/", "build"))}
          if event == "workflow_dispatch":
              files = sorted(ours)
          else:
              changed = subprocess.run(["git", "diff", "--name-only", "--diff-filter=d", base, "--", "*.cpp"],
                  capture_output=True, text=True, check=True).stdout.split()
              files = sorted(set(changed) & ours)
          print(f"clang-tidy: {len(files)} file(s)")
          if files and event == "workflow_dispatch":
              out = subprocess.run(["run-clang-tidy", "-quiet", "-p", "build-tidy"] + files, capture_output=True, text=True).stdout
              found = [line for line in out.split("\n") if ": warning: " in line or ": error: " in line]
              checks = {}
              for line in set(found):
                  name = line.rsplit("[", 1)[-1].rstrip("]") if line.endswith("]") else "other"
                  checks[name] = checks.get(name, 0) + 1
              for name, count in sorted(checks.items(), key=lambda item: -item[1]):
                  print(f"{count:6} {name}")
              print(f"clang-tidy report: {len(set(found))} distinct finding(s)")
          elif files:
              sys.exit(subprocess.run(["run-clang-tidy", "-quiet", "-p", "build-tidy", "-warnings-as-errors=*"] + files).returncode)
          PY

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      # clang, as the Linux kit (zig) and the sanitizers job: GCC cannot compile XenonUtils (xbox.h).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang libusb-1.0-0-dev zlib1g-dev libvulkan-dev libx11-dev
          echo "TOOLCHAIN=-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
      # The kit's toolchain, not MSVC, so CI builds what players get: llvm-mingw of tools/build_windows.sh (kit.txt).
      - name: llvm-mingw
        if: runner.os == 'Windows'
        run: |
          v=20260922
          curl -sSfLO "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip"
          echo "e3ad77d117a4bea19a7a3b333341824d79a5a371004a10e25b8504e7b3047666  llvm-mingw-$v-ucrt-x86_64.zip" | sha256sum -c
          7z x -y -o"$RUNNER_TEMP" "llvm-mingw-$v-ucrt-x86_64.zip" > /dev/null
          root=$(cygpath -m "$RUNNER_TEMP")/llvm-mingw-$v-ucrt-x86_64
          echo "TOOLCHAIN=-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-w64-mingw32-clang.cmake -DLLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          command -v ninja || pip install ninja
      - name: Configure (tests only, no game)
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSKY_WERROR=ON -DSKY_TESTS_ONLY=ON ${TOOLCHAIN:-}
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libusb-1.0-0-dev zlib1g-dev libvulkan-dev libx11-dev
      - run: >
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang -DSKY_SANITIZE=address -DSKY_TESTS_ONLY=ON
      - run: cmake --build build-asan --parallel
      - run: ctest --test-dir build-asan --output-on-failure
